name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: powershell
        run: .\package.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: CodexQuota-Windows
          path: artifacts/*
          if-no-files-found: error
