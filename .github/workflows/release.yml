name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Build, test and package
        shell: powershell
        run: .\package.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" artifacts/CodexQuota-Windows.zip artifacts/SHA256SUMS.txt --verify-tag --title "CodexQuota $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release failed.' }
